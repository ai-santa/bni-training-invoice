<script type="text/babel" data-presets="classic-react">
const { useState, useEffect, useMemo } = React;

/* ============================================================
   BNI トレーニング受講料 請求システム
   ・受講者：過去6か月分のトレーニングをまとめて入力 → 請求書PDF
   ・管理者：パスワードで入り、履歴の閲覧と「未払い／支払い済」管理
   ============================================================ */

const APP_VERSION = "Ver1-006";

/* ------------------------------------------------------------
   ★ 管理者パスワードの初期値（マスター管理画面から変更できます）
      ここを書き換えると「最初の1回」のパスワードが変わります。
   ------------------------------------------------------------ */
const DEFAULT_ADMIN_PASSWORD = "bni-dna";

/* ------------------------------------------------------------
   Firebase（IERアプリと同じプロジェクトを、BNI専用の入れ物で間借り）
   ※ 入れ物（コレクション）名が違うので IER のデータとは混ざりません
   ------------------------------------------------------------ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAJmNm7RjaBhe8AAUfGqjL7RS37MLmEBII",
  authDomain:        "invoice-app-544b6.firebaseapp.com",
  projectId:         "invoice-app-544b6",
  storageBucket:     "invoice-app-544b6.firebasestorage.app",
  messagingSenderId: "245544696406",
  appId:             "1:245544696406:web:a08ba67808c73762eb19f7",
};

/* ------------------------------------------------------------
   Firestore の入れ物
   ・請求書／マスターの各項目は「1件＝1ドキュメント」で保存する。
     こうしておくと、複数の人が同時に別々のものを触っても
     お互いを上書きして消してしまうことがない。
   ・bni_masters は設定（settings）専用。
     旧バージョンでは members/trainings/regions も配列で入れていたが、
     起動時に自動で新しい入れ物へ引っ越す（migrateMasters）。
   ------------------------------------------------------------ */
const COL = {
  invoices:  "bni_invoices",
  masters:   "bni_masters",   // settings のみ
  counters:  "bni_counters",  // 請求書番号の採番カウンター
  members:   "bni_members",
  trainings: "bni_trainings",
  regions:   "bni_regions",
  roles:     "bni_roles",     // 役職マスター（Ver1-006〜）
};
const MASTER_KEYS = ["members", "trainings", "regions", "roles"];

const loadFirebase = (() => {
  let promise = null;
  return () => {
    if (promise) return promise;
    promise = new Promise((resolve, reject) => {
      const load = (s) => new Promise((res, rej) => {
        const el = document.createElement("script");
        el.src = s; el.onload = res; el.onerror = rej;
        document.head.appendChild(el);
      });
      Promise.all([
        load("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"),
        load("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"),
      ]).then(() => {
        const app = window.firebase.initializeApp(FIREBASE_CONFIG);
        resolve(window.firebase.firestore());
      }).catch(reject);
    });
    return promise;
  };
})();

// Firestore は undefined を保存できないため、保存前に取り除く
function stripUndefined(value) {
  if (Array.isArray(value)) return value.map(stripUndefined);
  if (value && typeof value === "object") {
    const out = {};
    for (const k in value) {
      if (value[k] === undefined) continue;
      out[k] = stripUndefined(value[k]);
    }
    return out;
  }
  return value;
}

/* ============================================================
   共通ヘルパー
   ============================================================ */
const pad2 = (n) => String(n).padStart(2, "0");
const fmt  = (n) => Number(n || 0).toLocaleString("ja-JP");
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function fmtJP(s) {
  if (!s) return "—";
  const p = String(s).split("-");
  return p.length === 3 ? Number(p[0]) + "年" + Number(p[1]) + "月" + Number(p[2]) + "日" : s;
}
function fmtSlash(s) {
  if (!s) return "";
  const p = String(s).split("-");
  return p.length === 3 ? p[0] + "/" + p[1] + "/" + p[2] : s;
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function escBr(s) {
  return esc(s).replace(/\n/g, "<br>");
}

const EMPTY_ITEM  = () => ({ id: uid(), date: "", title: "", region: "", fee: "" });
const BLANK_ITEMS = (n) => Array.from({ length: n || 10 }, EMPTY_ITEM);

const EMPTY_MASTERS = () => ({
  members: [],
  trainings: [],
  regions: [],
  roles: [],
  settings: { billTo: "BNI 福井 御中", adminPassword: "", footerNote: "", rate: 50 },
});

const EMPTY_FORM = () => ({
  id: null, docNumber: "", createdAt: todayStr(), memberId: "",
  items: BLANK_ITEMS(10), note: "", status: "unpaid", paidAt: null,
});

const isFilled  = (it) => !!(it.date || it.title || it.region || (it.fee !== "" && it.fee != null));
const filledOf  = (items) => (items || []).filter(isFilled);
const calcTotal = (items) => (items || []).reduce((s, it) => s + (Number(it.fee) || 0), 0);

/* ------------------------------------------------------------
   補助額の計算（Ver1-006〜）
   ・補助額 ＝ 受講料金 × 補助率（％）の 1円未満切り捨て
   ・役職が「県外も補助対象」でない人が、「BNI福井開催」の印が無いリージョンを
     選んだ行は「補助対象外」＝ 0円
   ・Ver1-005 以前に登録した請求書（calcVersion なし）は、
     これまでどおり受講料金の合計がそのまま請求額（さかのぼって変えない）
   ------------------------------------------------------------ */
const DEFAULT_RATE = 50;
function rateOf(settings) {
  const r = Number(settings && settings.rate);
  return (isFinite(r) && r > 0 && r <= 100) ? r : DEFAULT_RATE;
}
function isInPrefRegion(regionName, regions) {
  const r = (regions || []).find((x) => x.name === regionName);
  return !!(r && r.inPref);
}
function roleOfMember(member, roles) {
  if (!member || !member.roleId) return null;
  return (roles || []).find((r) => r.id === member.roleId) || null;
}
// ctx = { rate, outOfPrefOk, regions }
function itemSubsidy(item, ctx) {
  const fee = Number(item.fee) || 0;
  const eligible = !!(ctx.outOfPrefOk || isInPrefRegion(item.region, ctx.regions));
  return { eligible: eligible, subsidy: eligible ? Math.floor(fee * ctx.rate / 100) : 0 };
}
const isV2 = (inv) => !!(inv && Number(inv.calcVersion) >= 2);
// 請求書1枚の請求額（新ルールは補助額の合計、旧ルールは受講料金の合計）
function invTotal(inv) {
  const items = filledOf(inv && inv.items);
  if (isV2(inv)) return items.reduce((s, it) => s + (Number(it.subsidy) || 0), 0);
  return calcTotal(items);
}
function periodOf(items) {
  const ds = (items || []).map((i) => i.date).filter(Boolean).sort();
  return ds.length ? { from: ds[0], to: ds[ds.length - 1] } : { from: "", to: "" };
}
function docPrefix(dateStr) {
  return "BNI-" + String(dateStr).replace(/-/g, "") + "-";
}
// その日すでに使われている連番の最大値（手元で分かる範囲）
function localMaxSeq(invoices, dateStr) {
  const prefix = docPrefix(dateStr);
  const nums = (invoices || [])
    .filter((v) => String(v.docNumber || "").indexOf(prefix) === 0)
    .map((v) => parseInt(String(v.docNumber).slice(prefix.length), 10) || 0);
  return nums.length ? Math.max.apply(null, nums) : 0;
}
function makeDocNumber(invoices, dateStr) {
  return docPrefix(dateStr) + String(localMaxSeq(invoices, dateStr) + 1).padStart(3, "0");
}

/* 請求書番号を「予約」して取る
   ------------------------------------------------------------
   複数の人が同じ瞬間に登録しても番号が重複しないように、
   Firestore のトランザクション（順番待ちの仕組み）で
   1つずつ確実に番号を払い出す。
   カウンターが無い日は、手元で分かっている最大値から始める。
   オフライン等で失敗したときは手元採番に切り替え、呼び出し元に知らせる。 */
async function reserveDocNumber(db, dateStr, fallbackMax) {
  const ymd = String(dateStr).replace(/-/g, "");
  const ref = db.collection(COL.counters).doc(ymd);
  const seq = await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const cur = (snap.exists && typeof snap.data().seq === "number")
      ? snap.data().seq
      : (fallbackMax || 0);
    const next = cur + 1;
    tx.set(ref, { seq: next }, { merge: true });
    return next;
  });
  return docPrefix(dateStr) + String(seq).padStart(3, "0");
}
const sortByTsDesc = (arr) => arr.slice().sort((a, b) => (Number(b._ts) || 0) - (Number(a._ts) || 0));

/* 旧バージョン（マスターを1つの配列でまとめて保存していた形）から
   「1件＝1ドキュメント」形式へ引っ越す。
   ・すでに引っ越し済みなら何もしない
   ・同じ端末・別の端末で同時に走っても、同じIDで書くだけなので壊れない */
async function migrateMasters(db) {
  for (let i = 0; i < MASTER_KEYS.length; i++) {
    const key = MASTER_KEYS[i];
    const oldRef = db.collection(COL.masters).doc(key);
    const oldSnap = await oldRef.get();
    if (!oldSnap.exists) continue;

    const arr = oldSnap.data().value;
    if (!Array.isArray(arr) || arr.length === 0) { await oldRef.delete(); continue; }

    const batch = db.batch();
    arr.forEach((item, idx) => {
      const id = item.id || (key + "-" + idx + "-" + Math.random().toString(36).slice(2, 8));
      const doc = stripUndefined(Object.assign({}, item, { id: id, order: idx }));
      batch.set(db.collection(COL[key]).doc(id), doc, { merge: true });
    });
    batch.delete(oldRef);
    await batch.commit();
  }
}

/* Ver1-006 の初期データを1回だけ入れる
   ・役職マスターが空なら、よく使う4つを入れる（先方で自由に直せる）
   ・リージョンに「BNI福井開催」の印がまだ1つも無ければ、「BNI福井」に印を付ける
   ・入れ終わったら bni_masters/_migrations に印を残し、2回目以降は何もしない
   ・決まったIDで書くので、複数の端末で同時に走っても重複しない */
const SEED_ROLES = [
  { id: "role-ambassador", name: "アンバサダー",                     outOfPref: true  },
  { id: "role-dc",         name: "ディレクターコンサルタント（DC）", outOfPref: true  },
  { id: "role-admin",      name: "アドミン",                         outOfPref: true  },
  { id: "role-support",    name: "アンバサダーサポート",             outOfPref: false },
];
async function migrateV6(db) {
  const flagRef = db.collection(COL.masters).doc("_migrations");
  const flag = await flagRef.get();
  if (flag.exists && flag.data().v6) return;

  const batch = db.batch();
  const rolesSnap = await db.collection(COL.roles).limit(1).get();
  if (rolesSnap.empty) {
    SEED_ROLES.forEach((r, i) => {
      batch.set(db.collection(COL.roles).doc(r.id), Object.assign({}, r, { order: i }), { merge: true });
    });
  }
  const regSnap = await db.collection(COL.regions).get();
  const anyFlag = regSnap.docs.some((d) => Object.prototype.hasOwnProperty.call(d.data(), "inPref"));
  if (!anyFlag) {
    regSnap.docs.forEach((d) => {
      if (String(d.data().name || "").replace(/\s/g, "") === "BNI福井") batch.set(d.ref, { inPref: true }, { merge: true });
    });
  }
  batch.set(flagRef, { v6: true, at: new Date().toISOString() }, { merge: true });
  await batch.commit();
}

/* ============================================================
   CSV 書き出し
   ・Excel で開いても文字化けしないよう UTF-8 の BOM を先頭に付ける
   ・「=」「+」等で始まる値はExcelが式として実行してしまうため無効化する
   ============================================================ */
function csvCell(v) {
  let s = (v === null || v === undefined) ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;      // 数式インジェクション対策
  return '"' + s.replace(/"/g, '""') + '"';
}
function toCSV(headers, rows) {
  const lines = [headers.map(csvCell).join(",")];
  rows.forEach((r) => lines.push(r.map(csvCell).join(",")));
  return lines.join("\r\n");
}
function downloadCSV(filename, csvText) {
  const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);   // Excel用のおまじない
  const blob = new Blob([bom, csvText], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const statusLabel = (s) => (s === "paid" ? "支払い済" : "未払い");

const ruleLabel = (v) => (isV2(v) ? "補助率" + v.rate + "%" : "旧ルール（全額）");
const roleLabel = (v) => (isV2(v) ? (v.memberRoleName || "") : "");
const outLabel  = (v) => (isV2(v) ? (v.memberRoleOutOfPref ? "対象" : "対象外") : "");

// ① 明細ごと（トレーニング1件＝1行）：集計・経理向き
function csvDetail(list) {
  const headers = ["請求書番号", "支払い状態", "支払い登録日", "請求日", "請求元", "役職", "県外の補助", "住所", "電話番号",
                   "振込先", "登録番号", "計算ルール", "No", "受講日", "トレーニング名", "リージョン", "受講料金",
                   "補助対象", "補助額", "請求書の請求額", "備考", "番号が仮"];
  const rows = [];
  list.forEach((v) => {
    const items = filledOf(v.items);
    const total = invTotal(v);
    const v2 = isV2(v);
    items.forEach((it, i) => {
      rows.push([v.docNumber, statusLabel(v.status), v.paidAt || "", v.createdAt, v.memberName,
                 roleLabel(v), outLabel(v),
                 v.memberAddress || "", v.memberTel || "", v.memberBank || "", v.memberInvoiceNo || "",
                 ruleLabel(v), i + 1, it.date, it.title, it.region, Number(it.fee) || 0,
                 v2 ? (it.eligible ? "対象" : "対象外") : "対象",
                 v2 ? (Number(it.subsidy) || 0) : (Number(it.fee) || 0),
                 total, v.note || "", v.numberProvisional ? "仮" : ""]);
    });
  });
  return toCSV(headers, rows);
}

// ② 請求書ごと（1請求書＝1行）：支払い管理向き
function csvSummary(list) {
  const headers = ["請求書番号", "支払い状態", "支払い登録日", "請求日", "請求元", "役職", "県外の補助", "住所", "電話番号",
                   "振込先", "登録番号", "対象期間(開始)", "対象期間(終了)", "件数", "計算ルール",
                   "受講料金の合計", "請求額", "備考", "番号が仮"];
  const rows = list.map((v) => {
    const p = periodOf(v.items);
    return [v.docNumber, statusLabel(v.status), v.paidAt || "", v.createdAt, v.memberName,
            roleLabel(v), outLabel(v),
            v.memberAddress || "", v.memberTel || "", v.memberBank || "", v.memberInvoiceNo || "",
            p.from, p.to, filledOf(v.items).length, ruleLabel(v),
            calcTotal(filledOf(v.items)), invTotal(v), v.note || "",
            v.numberProvisional ? "仮" : ""];
  });
  return toCSV(headers, rows);
}

/* localStorage（オフライン時の予備・クラウドが本命） */
const LS = { invoices: "bni_invoices_v1", masters: "bni_masters_v1" };
function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function saveLS(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

/* ============================================================
   スタイル
   ============================================================ */
const RED  = "#c8102e";
const NAVY = "#1f3864";
const S = {
  page:    { maxWidth: 1140, margin: "0 auto", padding: "0 14px 60px" },
  card:    { background: "#fff", borderRadius: 12, boxShadow: "0 1px 3px #0000000f", padding: 18, marginBottom: 16 },

  btn: (bg, fg) => ({

  tiny:    { fontSize: 12, color: "#8a8f98" },
  modalBg: { position: "fixed", inset: 0, background: "#0009", zIndex: 3000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 },

/* ============================================================
   請求書PDF（A4縦）
   ============================================================ */
function buildInvoiceHTML(inv, settings) {
  const items = filledOf(inv.items);
  const v2    = isV2(inv);
  const total = invTotal(inv);
  const fees  = calcTotal(items);
  const p     = periodOf(items);
  const rows  = items.slice();

    : '<td colspan="4" style="' + FT + 'padding-right:10px;">合　計</td>'
      + '<td style="' + FT + 'font-size:1.05rem;">¥ ' + fmt(total) + '</td>';
  const ineligibleN = v2 ? items.filter((it) => !it.eligible).length : 0;

  const periodText = (p.from && p.to)
    ? (fmtJP(p.from) + " 〜 " + fmtJP(p.to))
    : "—";

  const billTo = (settings && settings.billTo) ? settings.billTo : "BNI 福井 御中";

  return '<!DOCTYPE html>\n'
+ '<html lang="ja"><head><meta charset="UTF-8">\n'
+ '<title>請求書 ' + esc(inv.docNumber) + '</title>\n'
+ '<style>\n'
+ "@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap');\n"

+ 'html,body{width:210mm;min-height:297mm;}\n'
+ "body{font-family:'Noto Serif JP',Georgia,serif;color:#1a1a1a;background:#fff;padding:14mm 15mm 12mm;font-size:10.5pt;}\n"
+ '@page{size:A4 portrait;margin:0;}\n'
+ '@media print{html,body{width:210mm;min-height:297mm;}}\n'
+ '</style></head><body>\n'

/* ヘッダー */
+ '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">'
+   '<div>'
+     '<div style="display:flex;align-items:baseline;gap:12px;">'
+       '<h1 style="font-size:1.9rem;font-weight:700;letter-spacing:0.18em;color:' + NAVY + ';margin:0;">請 求 書</h1>'
+       '<span style="background:' + RED + ';color:#fff;font-size:0.58rem;font-weight:700;letter-spacing:0.14em;padding:3px 10px;border-radius:2px;">INVOICE</span>'

+           '<td style="font-weight:700;padding-bottom:3px;">' + esc(inv.docNumber) + '</td></tr>'
+       '<tr><td style="color:#666;padding-right:10px;">請求日</td>'
+           '<td style="font-weight:700;">' + fmtJP(inv.createdAt) + '</td></tr>'

+     '<div style="font-weight:700;font-size:1rem;color:#111;margin-bottom:2px;">' + esc(inv.memberName) + '</div>'
+     (v2 && inv.memberRoleName ? '<div style="font-size:0.7rem;color:#555;">役職: ' + esc(inv.memberRoleName) + '</div>' : '')

+     (inv.memberTel ? '<div>TEL: ' + esc(inv.memberTel) + '</div>' : '')
+     (inv.memberInvoiceNo ? '<div style="font-size:0.7rem;color:#555;">登録番号: ' + esc(inv.memberInvoiceNo) + '</div>' : '')
+   '</div>'
+ '</div>'
+ '<div style="height:2.5px;background:linear-gradient(to right,' + RED + ',' + NAVY + ',#dfe3ea);margin-bottom:12px;"></div>'

/* 宛先＋対象期間 */
+ '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;">'
+   '<div>'
+     '<div style="font-size:1.15rem;font-weight:700;border-bottom:2px solid ' + NAVY + ';padding-bottom:3px;display:inline-block;">'
+       esc(billTo) + '</div>'

+ '</div>'

/* 合計 */
+ '<div style="display:flex;align-items:center;gap:14px;background:#fdecef;border:1.5px solid ' + RED + ';border-radius:4px;padding:10px 16px;margin-bottom:14px;">'
+   '<div style="font-size:0.86rem;font-weight:700;color:' + NAVY + ';letter-spacing:0.06em;">' + (v2 ? 'ご請求金額（補助額の合計）' : 'ご請求金額（合計）') + '</div>'
+   '<div style="flex:1;text-align:right;font-size:1.5rem;font-weight:700;color:#111;">¥ ' + fmt(total) + '</div>'

/* 明細 */
+ '<div style="font-size:0.82rem;font-weight:700;color:' + NAVY + ';margin-bottom:5px;">■ 受講トレーニング明細</div>'
+ '<table style="width:100%;border-collapse:collapse;font-size:9.5pt;table-layout:fixed;">'
+   colgroup
+   '<thead><tr style="background:' + NAVY + ';color:#fff;">' + headRow + '</tr></thead>'
+   '<tbody>' + bodyRows + '</tbody>'
+   '<tfoot><tr style="background:#f2f4f7;">' + footRow + '</tr></tfoot>'
+ '</table>'

/* 振込先・備考 */
+ '<div style="display:flex;gap:14px;margin-top:16px;">'
+   '<div style="flex:1;border:1px solid #c9ced6;border-radius:4px;padding:10px 12px;">'

/* ============================================================
   小さな部品
   ============================================================ */
function StatusBadge({ status, onClick, small }) {
  const paid = status === "paid";
  const base = {
    display: "inline-flex", alignItems: "center", gap: 5,
    background: paid ? "#e6f6ec" : "#fdecef",
    color: paid ? "#1b7f43" : RED,
    border: "1.5px solid " + (paid ? "#1b7f43" : RED),
    borderRadius: 999, padding: small ? "3px 10px" : "5px 14px",
    fontWeight: 700, fontSize: small ? 12 : 13, whiteSpace: "nowrap",
    cursor: onClick ? "pointer" : "default",
  };
  return (
    <span style={base} onClick={onClick} title={onClick ? "クリックで支払い状態を切り替え" : ""}>
      <span style={{ fontSize: small ? 11 : 13 }}>{paid ? "🟢" : "🔴"}</span>
      {paid ? "支払い済" : "未払い"}
    </span>
  );
}

function Field({ label, children, hint }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <label style={S.label}>{label}</label>
      {children}
      {hint ? <div style={{ ...S.tiny, marginTop: 4 }}>{hint}</div> : null}
    </div>
  );
}

function ConfirmDialog({ data, onClose }) {
  if (!data) return null;
  return (
    <div style={S.modalBg} onClick={onClose}>
      <div style={S.modal} className="fade-in" onClick={(e) => e.stopPropagation()}>
        <div style={{ fontSize: 17, fontWeight: 700, color: NAVY, marginBottom: 10 }}>{data.title || "確認"}</div>
        <div style={{ fontSize: 15, lineHeight: 1.8, color: "#333", whiteSpace: "pre-wrap", marginBottom: 20 }}>{data.message}</div>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          <button style={S.ghost} onClick={onClose}>いいえ</button>
          <button style={S.btn(data.color || NAVY)} onClick={() => { data.onYes(); onClose(); }}>
            {data.yesLabel || "はい"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   明細1行
   ============================================================ */
function ItemRow({ item, idx, trainings, regions, onChange, onClear, calc }) {
  const set = (k) => (e) => onChange(idx, k, e.target.value);
  const hasFee = item.fee !== "" && item.fee != null;
  let sub = <span style={{ color: "#b0b5bd" }}>—</span>;
  if (calc && hasFee && item.region) {
    sub = calc.eligible
      ? <span style={{ fontWeight: 700, color: NAVY }}>¥{fmt(calc.subsidy)}</span>
      : <span title="この役職は、BNI福井開催のイベントだけが補助の対象です"
              style={{ fontSize: 12, fontWeight: 700, color: RED, lineHeight: 1.3 }}>補助対象外<br />¥0</span>;
  }
  return (
    <div className="item-row">
      <div className="cell-no" style={{ textAlign: "center", color: "#9aa0a8", fontSize: 13, fontWeight: 700 }}>
        {idx + 1}
      </div>
      <div className="cell-date">
        <span className="m-label">受講日</span>
        <input type="date" value={item.date} onChange={set("date")} />
      </div>
      <div className="cell-ttl" style={{ minWidth: 0 }}>
        <span className="m-label">トレーニング名</span>
        <select value={item.title} onChange={set("title")}>
          <option value="">— 選んでください —</option>
          {trainings.map((t) => <option key={t.id} value={t.name}>{t.name}</option>)}
          {item.title && trainings.every((t) => t.name !== item.title)
            ? <option value={item.title}>{item.title}（マスターにない項目）</option> : null}
        </select>
      </div>
      <div className="cell-reg">
        <span className="m-label">リージョン</span>
        <select value={item.region} onChange={set("region")}>
          <option value="">— 選んでください —</option>
          {regions.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
          {item.region && regions.every((r) => r.name !== item.region)
            ? <option value={item.region}>{item.region}（マスターにない項目）</option> : null}
        </select>
      </div>
      <div className="cell-fee">
        <span className="m-label">受講料金（円）</span>
        <input type="number" inputMode="numeric" min="0" step="1" placeholder="0"
               value={item.fee} onChange={set("fee")} style={{ textAlign: "right" }} />
      </div>
      <div className="cell-sub" style={{ textAlign: "right" }}>
        <span className="m-label">補助額</span>
        {sub}
      </div>
      <div className="cell-del">
        <button onClick={() => onClear(idx)} title="この行を消す"
          style={{ background: "#f3f4f6", color: "#8a8f98", borderRadius: 7, width: 36, height: 36, fontSize: 15 }}>
          ✕
        </button>
      </div>
    </div>
  );
}

function EntryPanel({ form, setForm, masters, invoices, onSave, onPrint, onView, saved, saving, onReset, fbStatus }) {
  const members   = masters.members || [];
  const trainings = masters.trainings || [];
  const regions   = masters.regions || [];
  const roles     = masters.roles || [];
  const member    = members.find((m) => m.id === form.memberId);
  const role      = roleOfMember(member, roles);
  const rate      = rateOf(masters.settings);
  const ctx       = role ? { rate: rate, outOfPrefOk: !!role.outOfPref, regions: regions } : null;
  const noRole    = !!member && !role;

  const setField = (k, v) => setForm((f) => Object.assign({}, f, { [k]: v }));
  const setItem = (idx, key, val) => setForm((f) => {
    const items = f.items.slice();
    items[idx] = Object.assign({}, items[idx], { [key]: val });
    return Object.assign({}, f, { items: items });
  });
  const clearItem = (idx) => setForm((f) => {
    const items = f.items.slice();
    items[idx] = EMPTY_ITEM();
    return Object.assign({}, f, { items: items });
  });
  const addRow = () => setForm((f) => Object.assign({}, f, { items: f.items.concat([EMPTY_ITEM()]) }));

  const filled = filledOf(form.items);
  const total  = calcTotal(form.items);
  const subTotal = ctx ? filled.reduce((s, it) => s + itemSubsidy(it, ctx).subsidy, 0) : null;
  const p      = periodOf(form.items);

  const myInvoices = form.memberId
    ? sortByTsDesc(invoices.filter((v) => v.memberId === form.memberId)).slice(0, 8)
    : [];

  const noMaster = members.length === 0;

  return (
    <div>
      {noMaster ? (
        <div style={{ ...S.card, background: "#fff8e1", border: "1px solid #ffd54f" }}>
          <div style={{ fontWeight: 700, color: "#8a6d00", marginBottom: 6 }}>⚠️ まだ準備ができていません</div>
          <div style={{ fontSize: 14, lineHeight: 1.8, color: "#6b5600" }}>

            <b>入力者・トレーニング名・リージョン</b>を登録してください。
          </div>
        </div>
      ) : null}

      {/* 保存完了バナー */}
      {saved ? (
        <div className="fade-in" style={{ ...S.card, background: "#e6f6ec", border: "1.5px solid #1b7f43" }}>
          <div style={{ fontWeight: 700, color: "#1b7f43", fontSize: 16, marginBottom: 6 }}>
            ✅ 請求書を登録しました（{saved.docNumber}）
          </div>
          <div style={{ fontSize: 14, color: "#28603f", marginBottom: 14, lineHeight: 1.8 }}>
            請求額 <b>¥{fmt(invTotal(saved))}</b>／{filledOf(saved.items).length}件。
            下のボタンからPDFを保存して保管してください。
          </div>
          {saved.numberProvisional ? (
            <div style={{ background: "#fff8e1", border: "1px solid #ffd54f", borderRadius: 8, padding: "10px 12px", fontSize: 13, lineHeight: 1.8, color: "#6b5600", marginBottom: 14 }}>
              ⚠️ ネットにつながっていない状態で登録したため、<b>請求書番号は仮</b>です。
              他の人と番号が重なっている可能性があります。ネットにつないでから管理者にご連絡ください。

          ) : null}
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>

            <button style={S.ghost} onClick={() => onView(saved)}>👀 入力した内容を見る</button>
            <button style={S.ghost} onClick={onReset}>🧹 新しく入力する</button>

/* ============================================================

function HistoryPanel({ invoices, masters, onView, onToggle }) {
  const [fMember, setFMember] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [fMonth,  setFMonth]  = useState("");
  const members = masters.members || [];

  const list = useMemo(() => {
    return sortByTsDesc(invoices).filter((v) => {
      if (fMember && v.memberId !== fMember) return false;
      if (fStatus && (v.status || "unpaid") !== fStatus) return false;
      if (fMonth && String(v.createdAt || "").slice(0, 7) !== fMonth) return false;
      return true;
    });
  }, [invoices, fMember, fStatus, fMonth]);

  const sumAll    = list.reduce((s, v) => s + invTotal(v), 0);
  const sumUnpaid = list.filter((v) => (v.status || "unpaid") !== "paid").reduce((s, v) => s + invTotal(v), 0);
  const sumPaid   = sumAll - sumUnpaid;

  const months = useMemo(() => {
    const set = {};
    invoices.forEach((v) => { const m = String(v.createdAt || "").slice(0, 7); if (m) set[m] = 1; });
    return Object.keys(set).sort().reverse();
  }, [invoices]);

  const Tile = ({ label, value, color, bg }) => (
    <div style={{ background: bg, borderRadius: 10, padding: "14px 16px", flex: "1 1 180px", minWidth: 160 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#6b7280", marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 21, fontWeight: 700, color: color }}>{value}</div>
    </div>
  );

  return (
    <div>
      <div style={S.card}>
        <div style={S.h2}>💰 請求額のまとめ<span style={{ ...S.tiny, fontWeight: 400 }}>（下の絞り込み結果に連動します）</span></div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Tile label="件数" value={list.length + " 件"} color={NAVY} bg="#f2f4f7" />

          <Tile label="🟢 支払い済 合計" value={"¥" + fmt(sumPaid)} color="#1b7f43" bg="#e6f6ec" />
          <Tile label="総額" value={"¥" + fmt(sumAll)} color={NAVY} bg="#eef1f6" />

      </div>

      <div style={S.card}>
        <div style={S.h2}>🔎 絞り込み</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12 }}>
          <Field label="請求元">
            <select value={fMember} onChange={(e) => setFMember(e.target.value)}>
              <option value="">すべて</option>
              {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </Field>
          <Field label="支払い状態">
            <select value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
              <option value="">すべて</option>
              <option value="unpaid">🔴 未払い</option>
              <option value="paid">🟢 支払い済</option>
            </select>
          </Field>
          <Field label="請求日（年月）">
            <select value={fMonth} onChange={(e) => setFMonth(e.target.value)}>
              <option value="">すべて</option>
              {months.map((m) => <option key={m} value={m}>{m.replace("-", "年") + "月"}</option>)}
            </select>
          </Field>
        </div>
      </div>

      <div style={S.card}>
        <div style={S.h2}>📤 CSVで書き出す<span style={{ ...S.tiny, fontWeight: 400 }}>（Excelでそのまま開けます）</span></div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
          <button style={S.btn("#1b7f43")}

          </button>

            <button style={S.ghost}
              onClick={() => downloadCSV("BNIトレーニング請求_全件明細_" + todayStr() + ".csv", csvDetail(sortByTsDesc(invoices)))}>

        </div>
        <div style={{ ...S.tiny, lineHeight: 1.9 }}>

          ・<b>請求書ごと</b>＝請求書1枚が1行。支払い管理・振込作業をするときはこちら<br />

                      <td style={{ fontWeight: 700, whiteSpace: "nowrap" }}>

/* ============================================================
   管理者：マスター管理
   ============================================================ */
/* flagKey / flagLabel を渡すと、各行にオン・オフのチェックが付く
   （役職マスター＝「県外も補助対象」、リージョンマスター＝「BNI福井開催」） */
function SimpleListEditor({ title, hint, list, onChange, flagKey, flagLabel, flagOnText, flagOffText, note, onBeforeRemove }) {
  const [val, setVal] = useState("");
  const [newFlag, setNewFlag] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editVal, setEditVal] = useState("");

  const add = () => {
    const v = val.trim();
    if (!v) return;
    const item = { id: uid(), name: v };
    if (flagKey) item[flagKey] = !!newFlag;
    onChange(list.concat([item]));
    setVal("");
    setNewFlag(false);
  };
  const toggleFlag = (i) => {
    const next = list.slice();
    next[i] = Object.assign({}, next[i], { [flagKey]: !next[i][flagKey] });
    onChange(next);
  };
  const move = (i, d) => {
    const next = list.slice();
    const j = i + d;
    if (j < 0 || j >= next.length) return;
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  };
  const remove = (i) => {
    if (onBeforeRemove && !onBeforeRemove(list[i])) return;
    onChange(list.filter((_, k) => k !== i));
  };
  const commit = (i) => {
    const v = editVal.trim();
    if (v) {
      const next = list.slice();
      next[i] = Object.assign({}, next[i], { name: v });
      onChange(next);
    }
    setEditId(null);
  };

  return (
    <div style={S.card}>
      <div style={S.h2}>{title}<span style={{ ...S.tiny, fontWeight: 400 }}>{hint}</span></div>
      {note ? <div style={{ ...S.tiny, lineHeight: 1.8, marginTop: -6, marginBottom: 10 }}>{note}</div> : null}
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        <input value={val} onChange={(e) => setVal(e.target.value)} placeholder="新しく追加する名前を入力"
               onKeyDown={(e) => { if (e.key === "Enter") add(); }} style={{ flex: "1 1 220px", width: "auto" }} />
        {flagKey ? (
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 700, color: "#444", whiteSpace: "nowrap" }}>
            <input type="checkbox" checked={newFlag} onChange={(e) => setNewFlag(e.target.checked)} style={{ width: 18, height: 18 }} />
            {flagLabel}
          </label>
        ) : null}
        <button style={S.btn(NAVY)} onClick={add}>＋ 追加</button>
      </div>
      {list.length === 0 ? <div style={S.tiny}>まだ登録がありません。</div> : (
        <div style={{ border: "1px solid #e6e9ed", borderRadius: 8, overflow: "hidden" }}>
          {list.map((x, i) => (
            <div key={x.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderBottom: i === list.length - 1 ? "none" : "1px solid #eceef1", background: i % 2 ? "#fafbfc" : "#fff" }}>
              <span style={{ width: 26, color: "#aaa", fontSize: 13 }}>{i + 1}</span>
              {editId === x.id ? (
                <React.Fragment>
                  <input value={editVal} autoFocus onChange={(e) => setEditVal(e.target.value)}
                         onKeyDown={(e) => { if (e.key === "Enter") commit(i); }} />
                  <button style={S.btn("#1b7f43")} onClick={() => commit(i)}>保存</button>
                  <button style={S.ghost} onClick={() => setEditId(null)}>取消</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <span style={{ flex: 1, fontSize: 14 }}>{x.name}</span>
                  {flagKey ? (
                    <button onClick={() => toggleFlag(i)} title={"クリックで「" + flagLabel + "」を切り替え"}
                      style={{ borderRadius: 999, padding: "4px 12px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap",
                               background: x[flagKey] ? "#e6f6ec" : "#f3f4f6", color: x[flagKey] ? "#1b7f43" : "#6b7280",
                               border: "1.5px solid " + (x[flagKey] ? "#1b7f43" : "#ccd0d6") }}>
                      {x[flagKey] ? "✅ " + flagOnText : "— " + flagOffText}
                    </button>
                  ) : null}
                  <button style={{ ...S.ghost, padding: "5px 9px" }} onClick={() => move(i, -1)} title="上へ">▲</button>
                  <button style={{ ...S.ghost, padding: "5px 9px" }} onClick={() => move(i, 1)} title="下へ">▼</button>
                  <button style={{ ...S.ghost, padding: "5px 11px" }} onClick={() => { setEditId(x.id); setEditVal(x.name); }}>✏</button>
                  <button style={{ ...S.ghost, padding: "5px 11px", color: RED, borderColor: "#f0b8c0" }} onClick={() => remove(i)}>🗑</button>
                </React.Fragment>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MemberEditor({ list, onChange, roles }) {
  const BLANK = { id: "", name: "", address: "", tel: "", bank: "", invoiceNo: "", roleId: "" };
  const [edit, setEdit] = useState(null);
  const roleName = (m) => {
    const r = roleOfMember(m, roles);
    return r ? r.name : "";
  };

  const save = () => {
    if (!edit.name.trim()) { alert("氏名は必ず入力してください。"); return; }
    if (!edit.roleId) { alert("役職を選んでください。\n（役職が無い方は、入力画面で請求書を登録できません）"); return; }
    if (edit.id) {
      onChange(list.map((m) => (m.id === edit.id ? edit : m)));
    } else {
      onChange(list.concat([Object.assign({}, edit, { id: uid() })]));
    }
    setEdit(null);
  };
  const move = (i, d) => {
    const next = list.slice();
    const j = i + d;
    if (j < 0 || j >= next.length) return;
    const tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    onChange(next);
  };
  const remove = (m) => {
    if (!confirm("「" + m.name + "」さんをマスターから削除します。よろしいですか？\n※ すでに登録された請求書は残ります。")) return;
    onChange(list.filter((x) => x.id !== m.id));
  };

  return (
    <div style={S.card}>
      <div style={S.h2}>👤 入力者（請求元）マスター<span style={{ ...S.tiny, fontWeight: 400 }}>（請求書に載る氏名・住所・振込先）</span></div>

      {edit ? (
        <div style={{ border: "1.5px solid " + NAVY, borderRadius: 10, padding: 16, marginBottom: 14, background: "#f7f9fc" }}>
          <div style={{ fontWeight: 700, color: NAVY, marginBottom: 10 }}>{edit.id ? "内容を修正" : "新しく登録"}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 12 }}>
            <Field label="氏名（必須）">
              <input value={edit.name} onChange={(e) => setEdit(Object.assign({}, edit, { name: e.target.value }))} placeholder="例：福井 太郎" />
            </Field>
            <Field label="電話番号">
              <input value={edit.tel} onChange={(e) => setEdit(Object.assign({}, edit, { tel: e.target.value }))} placeholder="例：0776-00-0000" />
            </Field>
            <Field label="役職（必須）" hint="選択肢は下の「役職マスター」で追加・変更できます。">
              <select value={edit.roleId || ""} onChange={(e) => setEdit(Object.assign({}, edit, { roleId: e.target.value }))}>
                <option value="">— 選んでください —</option>
                {(roles || []).map((r) => (
                  <option key={r.id} value={r.id}>{r.name}{r.outOfPref ? "（県外も補助対象）" : "（BNI福井開催のみ）"}</option>
                ))}
              </select>
            </Field>
          </div>
          <Field label="住所">
            <input value={edit.address} onChange={(e) => setEdit(Object.assign({}, edit, { address: e.target.value }))} placeholder="例：〒910-0000 福井県福井市○○1-2-3" />
          </Field>
          <Field label="振込先" hint="銀行名・支店名・口座種別・口座番号・口座名義まで書くと親切です。">
            <textarea rows="2" value={edit.bank} onChange={(e) => setEdit(Object.assign({}, edit, { bank: e.target.value }))}
                      placeholder="例：福井銀行 本店営業部 普通 1234567 フクイ タロウ" />
          </Field>
          <Field label="インボイス登録番号（任意）">
            <input value={edit.invoiceNo} onChange={(e) => setEdit(Object.assign({}, edit, { invoiceNo: e.target.value }))} placeholder="例：T1234567890123（登録している方のみ）" />
          </Field>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={S.btn("#1b7f43")} onClick={save}>💾 保存</button>
            <button style={S.ghost} onClick={() => setEdit(null)}>取消</button>
          </div>
        </div>
      ) : (
        <button style={S.btn(NAVY)} onClick={() => setEdit(Object.assign({}, BLANK))}>＋ 入力者を追加</button>
      )}

      <div style={{ marginTop: 14 }}>
        {list.length === 0 ? <div style={S.tiny}>まだ登録がありません。</div> : (
          <div style={{ border: "1px solid #e6e9ed", borderRadius: 8, overflow: "hidden" }}>
            {list.map((m, i) => (
              <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", borderBottom: i === list.length - 1 ? "none" : "1px solid #eceef1", background: i % 2 ? "#fafbfc" : "#fff", flexWrap: "wrap" }}>
                <span style={{ width: 26, color: "#aaa", fontSize: 13 }}>{i + 1}</span>
                <div style={{ flex: "1 1 240px", minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>
                    {m.name}
                    <span style={{ marginLeft: 8, fontSize: 12, fontWeight: 700, borderRadius: 999, padding: "2px 10px",
                                   background: roleName(m) ? "#eef1f6" : "#fdecef", color: roleName(m) ? NAVY : RED }}>
                      {roleName(m) || "役職 未登録"}
                    </span>
                  </div>
                  <div style={{ ...S.tiny, lineHeight: 1.7 }}>
                    {m.address || "住所未登録"}{m.tel ? "／TEL " + m.tel : ""}<br />
                    振込先：{m.bank || "未登録"}{m.invoiceNo ? "／登録番号 " + m.invoiceNo : ""}
                  </div>
                </div>
                <button style={{ ...S.ghost, padding: "5px 9px" }} onClick={() => move(i, -1)}>▲</button>
                <button style={{ ...S.ghost, padding: "5px 9px" }} onClick={() => move(i, 1)}>▼</button>
                <button style={{ ...S.ghost, padding: "5px 11px" }} onClick={() => setEdit(Object.assign({}, m))}>✏ 編集</button>
                <button style={{ ...S.ghost, padding: "5px 11px", color: RED, borderColor: "#f0b8c0" }} onClick={() => remove(m)}>🗑</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

      <SimpleListEditor

      <SimpleListEditor

        list={masters.regions || []}
        flagKey="inPref" flagLabel="BNI福井開催" flagOnText="BNI福井開催" flagOffText="県外・他リージョン"

function AdminGate({ expected, onOk, onClose }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (val === expected) { onOk(); }
    else { setErr(true); setVal(""); }
  };
  return (
    <div style={S.modalBg} onClick={onClose}>
      <div style={S.modal} className="fade-in" onClick={(e) => e.stopPropagation()}>
        <div style={{ fontSize: 18, fontWeight: 700, color: NAVY, marginBottom: 6 }}>🔒 管理者パスワード</div>
        <div style={{ ...S.tiny, marginBottom: 14 }}>管理者の方のみご利用ください。</div>
        <input type="password" value={val} autoFocus placeholder="パスワードを入力"
               onChange={(e) => { setVal(e.target.value); setErr(false); }}
               onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
        {err ? <div style={{ color: RED, fontSize: 13, fontWeight: 700, marginTop: 8 }}>パスワードが違います。</div> : null}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 18 }}>
          <button style={S.ghost} onClick={onClose}>閉じる</button>
          <button style={S.btn(NAVY)} onClick={submit}>入る</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const [masters,  setMasters]  = useState(() => loadLS(LS.masters, EMPTY_MASTERS()));
  const [invoices, setInvoices] = useState(() => loadLS(LS.invoices, []));
  const [fbStatus, setFbStatus] = useState("connecting");
  const [db, setDb]             = useState(null);

  const [tab, setTab]           = useState("entry");
  const [isAdmin, setIsAdmin]   = useState(false);
  const [gate, setGate]         = useState(false);

  const [form, setForm]         = useState(EMPTY_FORM);
  const [saved, setSaved]       = useState(null);
  const [saving, setSaving]     = useState(false);
  const [viewInv, setViewInv]   = useState(null);
  const [printHTML, setPrintHTML] = useState(null);
  const [confirmData, setConfirmData] = useState(null);

  const adminPassword = (masters.settings && masters.settings.adminPassword) || DEFAULT_ADMIN_PASSWORD;

  /* --- Firebase 接続・購読 --- */
  useEffect(() => {
    const unsubs = [];
    let alive = true;

    loadFirebase().then(async (d) => {
      if (!alive) return;
      setDb(d);
      setFbStatus("online");

      // 旧バージョン（配列マスター）からの引っ越し。何度実行しても安全。
      try { await migrateMasters(d); } catch (e) { /* 引っ越しに失敗しても以降の処理は続ける */ }
      // Ver1-006 の初期データ（役職4つ・BNI福井の印）。2回目以降は何もしない。
      try { await migrateV6(d); } catch (e) { /* 失敗しても以降の処理は続ける */ }
      if (!alive) return;

      // 請求書
      unsubs.push(d.collection(COL.invoices).onSnapshot(
        (snap) => {
          const arr = snap.docs.map((x) => Object.assign({}, x.data(), { _fbId: x.id }));
          setInvoices(sortByTsDesc(arr));
          saveLS(LS.invoices, arr);
        },
        () => setFbStatus("offline")
      ));

      // マスター各種（1件＝1ドキュメント）
      MASTER_KEYS.forEach((key) => {
        unsubs.push(d.collection(COL[key]).onSnapshot(
          (snap) => {
            const arr = snap.docs
              .map((x) => Object.assign({ id: x.id }, x.data()))
              .sort((a, b) => (typeof a.order === "number" ? a.order : 9999) - (typeof b.order === "number" ? b.order : 9999));
            setMasters((m) => {
              const next = Object.assign({}, m, { [key]: arr });
              saveLS(LS.masters, next);
              return next;
            });
          },
          () => setFbStatus("offline")
        ));
      });

      // 設定
      unsubs.push(d.collection(COL.masters).doc("settings").onSnapshot(
        (doc) => {
          const v = doc.exists ? doc.data().value : null;
          setMasters((m) => {
            const next = Object.assign({}, m, { settings: v || EMPTY_MASTERS().settings });
            saveLS(LS.masters, next);
            return next;
          });
        },
        () => setFbStatus("offline")
      ));
    }).catch(() => setFbStatus("offline"));

    return () => { alive = false; unsubs.forEach((u) => { try { u(); } catch (e) {} }); };
  }, []);

  /* --- マスター保存 ---
     一覧まるごとではなく「変わった項目だけ」を書き込む。
     手元に無い項目（他の人がちょうど追加したもの）は消さないので、
     複数人が同時に編集してもお互いの登録が消えない。 */
  const setMasterKey = (key, value) => {
    const prev = masters[key] || [];
    const next = Object.assign({}, masters, { [key]: value });
    setMasters(next);
    saveLS(LS.masters, next);
    if (!db) return;

    if (key === "settings") {
      db.collection(COL.masters).doc("settings").set({ value: stripUndefined(value) })
        .catch(() => setFbStatus("offline"));
      return;
    }

    const coll = db.collection(COL[key]);
    const prevById = {};
    prev.forEach((x) => { prevById[x.id] = x; });
    const nextIds = {};

    (value || []).forEach((item, i) => {
      nextIds[item.id] = true;
      const withOrder = Object.assign({}, item, { order: i });
      const before = prevById[item.id];
      const unchanged = before && JSON.stringify(Object.assign({}, before, { order: i })) === JSON.stringify(withOrder);
      if (!unchanged) {
        coll.doc(item.id).set(stripUndefined(withOrder)).catch(() => setFbStatus("offline"));
      }
    });

    // 手元にあって新しい一覧から消えたものだけ削除する
    prev.forEach((item) => {
      if (!nextIds[item.id]) coll.doc(item.id).delete().catch(() => setFbStatus("offline"));
    });
  };

  /* --- 請求書の保存 --- */
  const saveInvoice = async () => {
    if (saving) return;                       // 二重クリック防止
    const member = (masters.members || []).find((m) => m.id === form.memberId);
    if (!member) { alert("「入力者（請求元）」を選んでください。"); return; }
    const role = roleOfMember(member, masters.roles);
    if (!role) { alert("役職が未登録のため、登録できません。\n管理者へご連絡ください。"); return; }

    const items = filledOf(form.items);
    if (items.length === 0) { alert("トレーニングを1件以上入力してください。"); return; }

    const bad = items.filter((it) => !it.date || !it.title || !it.region || !(Number(it.fee) > 0));
    if (bad.length > 0) {
      alert("入力もれがあります。\n受講日・トレーニング名・リージョン・受講料金は、入力した行すべてに必要です。\n（" + bad.length + "行）");
      return;
    }
    const rate = rateOf(masters.settings);
    const ctx = { rate: rate, outOfPrefOk: !!role.outOfPref, regions: masters.regions || [] };

    setSaving(true);

    // 番号を「予約」して取る（同時に登録されても重複しない）
    let docNumber = "";
    let numberProvisional = false;
    if (db) {
      try {
        docNumber = await reserveDocNumber(db, form.createdAt, localMaxSeq(invoices, form.createdAt));
      } catch (e) {
        docNumber = makeDocNumber(invoices, form.createdAt);
        numberProvisional = true;
        setFbStatus("offline");
      }
    } else {
      docNumber = makeDocNumber(invoices, form.createdAt);
      numberProvisional = true;
    }

    const inv = {
      id: uid(),
      docNumber: docNumber,
      createdAt: form.createdAt,
      memberId: member.id,
      memberName: member.name || "",
      memberAddress: member.address || "",
      memberTel: member.tel || "",
      memberBank: member.bank || "",
      memberInvoiceNo: member.invoiceNo || "",
      // 登録した時点の役職・補助の範囲・補助率を記録（あとで役職や補助率が変わっても、この請求書は当時のまま）
      memberRoleId: role.id,
      memberRoleName: role.name || "",
      memberRoleOutOfPref: !!role.outOfPref,
      rate: rate,
      calcVersion: 2,
      items: items.map((it) => {
        const c = itemSubsidy(it, ctx);
        return { id: it.id, date: it.date, title: it.title, region: it.region, fee: Number(it.fee) || 0,
                 inPref: isInPrefRegion(it.region, ctx.regions), eligible: c.eligible, subsidy: c.subsidy };
      }),
      feeTotal: calcTotal(items),
      note: form.note || "",
      status: "unpaid",
      paidAt: null,
      numberProvisional: numberProvisional,
      _ts: Date.now(),
    };

    inv.total = invTotal(inv);   // 請求額（補助額の合計）

    const next = [inv].concat(invoices);
    setInvoices(next);
    saveLS(LS.invoices, next);
    if (db) {
      try { await db.collection(COL.invoices).doc(inv.id).set(stripUndefined(inv)); }
      catch (e) { setFbStatus("offline"); }
    }
    setSaved(inv);
    setSaving(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  /* --- 支払い状態の切り替え --- */
  const toggleStatus = (inv) => {
    const toPaid = (inv.status || "unpaid") !== "paid";
    setConfirmData({
      title: toPaid ? "🟢 支払い登録" : "🔴 未払いに戻す",
      message: toPaid
        ? (inv.memberName + " さんの請求書\n" + inv.docNumber + "（¥" + fmt(invTotal(inv)) + "）を\n\n「支払い済」に登録しますか？")
        : (inv.memberName + " さんの請求書\n" + inv.docNumber + "（¥" + fmt(invTotal(inv)) + "）を\n\n「未払い」に戻しますか？"),
      yesLabel: toPaid ? "支払い済にする" : "未払いに戻す",
      color: toPaid ? "#1b7f43" : RED,
      onYes: () => {
        const patch = { status: toPaid ? "paid" : "unpaid", paidAt: toPaid ? todayStr() : null };
        const next = invoices.map((v) => (v.id === inv.id ? Object.assign({}, v, patch) : v));
        setInvoices(next);
        saveLS(LS.invoices, next);
        if (db) db.collection(COL.invoices).doc(inv.id).set(patch, { merge: true }).catch(() => setFbStatus("offline"));
        if (viewInv && viewInv.id === inv.id) setViewInv(Object.assign({}, viewInv, patch));
      },
    });
  };

  /* --- 削除（管理者のみ） --- */
  const deleteInvoice = (inv) => {
    setConfirmData({
      title: "🗑 請求書を削除",
      message: inv.docNumber + "（" + inv.memberName + " さん・¥" + fmt(invTotal(inv)) + "）を削除します。\n\nこの操作は元に戻せません。よろしいですか？",
      yesLabel: "削除する",
      color: RED,
      onYes: () => {
        const next = invoices.filter((v) => v.id !== inv.id);
        setInvoices(next);
        saveLS(LS.invoices, next);
        if (db) db.collection(COL.invoices).doc(inv.id).delete().catch(() => setFbStatus("offline"));
        setViewInv(null);
      },
    });
  };

  const printInvoice = (inv) => setPrintHTML(buildInvoiceHTML(inv, masters.settings || {}));

  const resetForm = () => { setForm(EMPTY_FORM()); setSaved(null); window.scrollTo({ top: 0, behavior: "smooth" }); };

  const openAdmin = () => { if (isAdmin) setTab("history"); else setGate(true); };

  const TabBtn = ({ id, label }) => (
    <button onClick={() => setTab(id)}
      style={{
        background: tab === id ? "#fff" : "transparent",
        color: tab === id ? NAVY : "#ffffffcc",
        borderRadius: "9px 9px 0 0", padding: "11px 20px", fontWeight: 700, fontSize: 14,
      }}>
      {label}
    </button>
  );

  const statusDot = fbStatus === "online" ? "#3ddc84" : (fbStatus === "connecting" ? "#f5c518" : "#ff6b6b");
  const statusText = fbStatus === "online" ? "クラウド接続中" : (fbStatus === "connecting" ? "接続中…" : "オフライン");

  return (
    <div>
      {/* ヘッダー */}
      <div style={{ background: "linear-gradient(135deg," + RED + " 0%, #9c0d24 55%," + NAVY + " 100%)", color: "#fff", paddingTop: 16 }}>
        <div style={{ maxWidth: 1140, margin: "0 auto", padding: "0 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
            <div>
              <div style={{ fontSize: 19, fontWeight: 700, letterSpacing: "0.04em" }}>BNI トレーニング受講料　請求システム</div>
              <div style={{ fontSize: 12, color: "#ffffffb0", marginTop: 2 }}>
                DnAチーム ／ {APP_VERSION}
                <span style={{ marginLeft: 12, display: "inline-flex", alignItems: "center", gap: 5 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: statusDot, display: "inline-block" }}></span>
                  {statusText}
                </span>
              </div>
            </div>
            <div style={{ flex: 1 }} />
            {isAdmin ? (
              <button onClick={() => { setIsAdmin(false); setTab("entry"); }}
                style={{ background: "#ffffff22", color: "#fff", border: "1px solid #ffffff55", borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 13 }}>
                🔓 管理者モードを終了
              </button>
            ) : (
              <button onClick={openAdmin}
                style={{ background: "#ffffff22", color: "#fff", border: "1px solid #ffffff55", borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 13 }}>
                🔒 管理者
              </button>
            )}
          </div>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            <TabBtn id="entry" label="📝 請求書を入力する" />
            {isAdmin ? <TabBtn id="history" label="📚 履歴・支払い管理" /> : null}
            {isAdmin ? <TabBtn id="master" label="⚙️ マスター管理" /> : null}
          </div>
        </div>
      </div>

      {/* 本体 */}
      <div style={S.page}>
        <div style={{ height: 18 }} />
        {tab === "entry" ? (
          <EntryPanel form={form} setForm={setForm} masters={masters} invoices={invoices}
                      onSave={saveInvoice} onPrint={printInvoice} onView={setViewInv} saved={saved}
                      saving={saving} onReset={resetForm} fbStatus={fbStatus} />
        ) : null}
        {tab === "history" && isAdmin ? (
          <HistoryPanel invoices={invoices} masters={masters} onView={setViewInv} onToggle={toggleStatus} />
        ) : null}
        {tab === "master" && isAdmin ? (
          <MasterPanel masters={masters} setMasterKey={setMasterKey} fbStatus={fbStatus} />
        ) : null}
      </div>

      {/* モーダル類 */}
      {gate ? (
        <AdminGate expected={adminPassword}
                   onOk={() => { setIsAdmin(true); setGate(false); setTab("history"); }}
                   onClose={() => setGate(false)} />
      ) : null}

      <DetailModal inv={viewInv} onClose={() => setViewInv(null)} onPrint={printInvoice}
                   onToggle={toggleStatus} onDelete={deleteInvoice}
                   readOnly={!isAdmin || tab === "entry"} />

      <ConfirmDialog data={confirmData} onClose={() => setConfirmData(null)} />

      {/* PDFプレビュー */}
      {printHTML ? (
        <div style={{ position: "fixed", inset: 0, background: "#000a", zIndex: 4000, display: "flex", flexDirection: "column" }}>
          <div style={{ background: NAVY, color: "#fff", padding: "10px 16px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", flexShrink: 0 }}>
            <span style={{ fontWeight: 700, fontSize: 14 }}>🖨 請求書プレビュー</span>
            <span style={{ fontSize: 12, color: "#ffffffaa" }}>印刷画面で「PDFとして保存」を選ぶと保管できます</span>
            <div style={{ flex: 1 }} />
            <button onClick={() => {
                const f = document.getElementById("pdf-iframe");
                if (f) { f.contentWindow.focus(); f.contentWindow.print(); }
              }}
              style={{ background: "#fff", color: NAVY, borderRadius: 7, padding: "8px 18px", fontWeight: 700, fontSize: 14 }}>
              🖨 印刷 / PDFで保存
            </button>
            <button onClick={() => setPrintHTML(null)}
              style={{ background: "transparent", color: "#fff", border: "1px solid #ffffff66", borderRadius: 7, padding: "8px 16px", fontWeight: 700, fontSize: 14 }}>
              ✕ 閉じる
            </button>
          </div>
          <iframe id="pdf-iframe" srcDoc={printHTML} title="請求書プレビュー"
                  style={{ flex: 1, border: "none", background: "#888" }} />
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
